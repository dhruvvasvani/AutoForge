apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoforge-backend
  namespace: autoforge
  labels:
    app: autoforge-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: autoforge-backend
  template:
    metadata:
      labels:
        app: autoforge-backend
    spec:
      containers:
        - name: backend
          image: autoforge/backend:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: SERVER_PORT
              value: "8080"
            - name: DB_HOST
              value: "postgres.autoforge.svc.cluster.local"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "autoforge"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: autoforge-secrets
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: autoforge-secrets
                  key: db-password
            - name: REDIS_HOST
              value: "redis.autoforge.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: SPRING_DATA_REDIS_HOST
              value: "redis.autoforge.svc.cluster.local"
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: autoforge-secrets
                  key: jwt-secret
            - name: AUTOFORGE_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: autoforge-secrets
                  key: internal-token
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: autoforge-secrets
                  key: internal-token
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: autoforge-backend-svc
  namespace: autoforge
spec:
  selector:
    app: autoforge-backend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
