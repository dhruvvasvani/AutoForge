version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: autoforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: autoforge
      POSTGRES_USER: autoforge
      POSTGRES_PASSWORD: autoforge_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoforge -d autoforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: autoforge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: autoforge-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/autoforge_neo4j_password
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "autoforge_neo4j_password", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autoforge-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: autoforge
      DB_USER: autoforge
      DB_PASSWORD: autoforge_secure_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: autoforge_neo4j_password
      JWT_SECRET: super-secure-autoforge-production-jwt-token-secret-key-at-least-256-bits-long
      GITHUB_WEBHOOK_SECRET: autoforge_gh_secret_key
      INTERNAL_API_KEY: autoforge_internal_pipeline_api_key_2026
      AUTOFORGE_UPLOAD_DIR: /app/uploads
      PYTHON_EXECUTABLE: python3
      SCANNER_WRAPPER_PATH: /app/2_pipeline/scanners/scan_wrapper.py
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - uploads_data:/app/uploads

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: autoforge-worker
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: autoforge
      DB_USER: autoforge
      DB_PASSWORD: autoforge_secure_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      INTERNAL_API_KEY: autoforge_internal_pipeline_api_key_2026
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  uploads_data:
