server:
  port: 8080

spring:
  application:
    name: autoforge-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:autoforge}?options=-c%20timezone=Asia/Kolkata
    username: ${DB_USER:autoforge}
    password: ${DB_PASSWORD:autoforge}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

autoforge:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-env-vars}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  github:
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:change-this-in-env-vars}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.autoforge: INFO
    org.springframework.security: INFO
