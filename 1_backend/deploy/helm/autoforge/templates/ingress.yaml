apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "autoforge.fullname" . }}-ingress
  labels:
    {{- include "autoforge.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - {{ .Values.ingress.host | default "autoforge.local" }}
      secretName: {{ include "autoforge.fullname" . }}-tls
  rules:
    - host: {{ .Values.ingress.host | default "autoforge.local" }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "autoforge.fullname" . }}-backend
                port:
                  number: 8080
