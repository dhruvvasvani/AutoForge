apiVersion: v1
kind: Secret
metadata:
  name: {{ include "autoforge.fullname" . }}-secrets
  labels:
    {{- include "autoforge.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_USER: "{{ .Values.postgresql.username | default "autoforge" }}"
  DB_PASSWORD: "{{ .Values.postgresql.password | default "autoforge" }}"
  JWT_SECRET: "{{ .Values.jwtSecret | default "default-chart-secret-please-override-in-prod-vault" }}"
  GITHUB_WEBHOOK_SECRET: "{{ .Values.githubWebhookSecret | default "default-github-webhook-secret" }}"
  INTERNAL_API_KEY: "{{ .Values.internalApiKey | default "default-internal-pipeline-key" }}"
  AUTOFORGE_INTERNAL_TOKEN: "{{ .Values.internalApiKey | default "default-internal-pipeline-key" }}"
