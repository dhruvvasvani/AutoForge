apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "autoforge.fullname" . }}-worker
  labels:
    {{- include "autoforge.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount | default 3 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "autoforge.name" . }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "autoforge.name" . }}
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag | default "latest" }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy | default "IfNotPresent" }}
          envFrom:
            - configMapRef:
                name: {{ include "autoforge.fullname" . }}-config
            - secretRef:
                name: {{ include "autoforge.fullname" . }}-secrets
          resources:
            requests:
              cpu: "1000m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
