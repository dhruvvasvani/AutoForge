apiVersion: v1
kind: Service
metadata:
  name: {{ include "autoforge.fullname" . }}-backend
  labels:
    {{- include "autoforge.labels" . | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.backend.service.port | default 8080 }}
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "autoforge.name" . }}
    app.kubernetes.io/component: backend
